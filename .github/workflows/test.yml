name: test

on:
  pull_request:
  push:
    branches: [develop, main, core-2nd-stage]

jobs:
  core-and-dashboard:
    name: Core + Active Dashboard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --check web/vps.js
      - run: npm run typecheck:alfred
      - run: npm run build:alfred
      - run: npm run build:web
      - name: Run Alfred Core & VPS Web tests
        run: npm run test:alfred
      - name: Run Active Dashboard tests (Auth, CostOps, DB, Kanban)
        run: >-
          npx vitest run
          src/__tests__/auth-*.test.ts
          src/__tests__/costops-*.test.ts
          src/__tests__/db.test.ts
          src/__tests__/db-init-concurrent.test.ts
          src/__tests__/kanban-*.test.ts
