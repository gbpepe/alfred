name: test

on:
  pull_request:
  push:
    branches: [develop, main, core-2nd-stage]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --check web/vps.js
      - run: npm run typecheck:alfred
      - run: npm run build:alfred
      - run: npm run build:web
      - run: npm run test:alfred
